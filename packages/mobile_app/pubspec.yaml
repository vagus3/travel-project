name: mobile_app
description: travel-project 모바일(Android/iOS) 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core: any
  flutter_riverpod: ^3.0.3
  google_fonts: ^6.3.2
  easy_localization: ^3.0.8
  intl: ^0.20.2
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2
  fl_chart: ^0.68.0
  firebase_core: ^4.2.0
  firebase_crashlytics: ^5.0.3
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^20.1.0
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  google_maps_flutter: ^2.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3
  pedantic_mono: ^1.34.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/translations/
    - .env
