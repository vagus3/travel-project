  google_maps_flutter: ^2.14.2
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^3.0.3
  custom_lint: ^0.8.0
