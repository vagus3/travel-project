# web_app 배포 (Deployment + Service)
#
# 이미지 준비 (Minikube):
#   eval $(minikube docker-env)
#   docker build -f packages/web_app/Dockerfile -t travel-project/web-app:local .
# 이미지 준비 (Docker Desktop Kubernetes):
#   docker build -f packages/web_app/Dockerfile -t travel-project/web-app:local .
#
# 적용:
#   kubectl apply -f k8s/web-app.yaml
# 접속 (Minikube):
#   minikube service web-app

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app
          image: travel-project/web-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
spec:
  selector:
    app: web-app
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
