# api_proxy 배포 (Deployment + Service)
#
# 사전 준비 — 시크릿은 매니페스트로 커밋하지 않고 명령으로 직접 생성합니다:
#   kubectl create secret generic api-proxy-secrets \
#     --from-env-file=packages/api_proxy/.env
#
# 이미지 준비 (Minikube):
#   eval $(minikube docker-env)
#   docker build -t travel-project/api-proxy:local packages/api_proxy
# 이미지 준비 (Docker Desktop Kubernetes):
#   docker build -t travel-project/api-proxy:local packages/api_proxy
#
# 적용:
#   kubectl apply -f k8s/api-proxy.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-proxy
  labels:
    app: api-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-proxy
  template:
    metadata:
      labels:
        app: api-proxy
    spec:
      containers:
        - name: api-proxy
          image: travel-project/api-proxy:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: api-proxy-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-proxy
spec:
  selector:
    app: api-proxy
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
